<style>

.big{padding:14px 22px;font-size:16px}.lg{margin:40px auto;max-width:460px}

body{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><g fill='none' stroke='%23808c99' stroke-opacity='.13' stroke-width='2'><rect x='10' y='60' width='40' height='40'/><rect x='55' y='60' width='40' height='40'/><rect x='32' y='20' width='40' height='40'/><path d='M10 80h40M55 80h40M32 40h40'/></g></svg>")}
header{background:linear-gradient(120deg,#111827,#374151 65%,#c2410c);color:#fff}header b{font-size:22px}header button{color:#fff}
nav{box-shadow:0 2px 6px rgba(0,0,0,.08)}nav button.on{background:var(--hl)}

.hero h2{margin:0 0 4px;font-size:24px}.hero p{margin:0;opacity:.8}.hero svg{color:#94a3b8;max-width:100%}
.tile{border-top:4px solid var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.08)}.tile b{font-size:34px}
button{transition:transform .1s}button:active{transform:scale(.97)}button.pr{box-shadow:0 2px 6px rgba(0,0,0,.25)}
table{box-shadow:0 1px 4px rgba(0,0,0,.07)}
body{background-image:linear-gradient(rgba(100,116,139,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(100,116,139,.10) 1px,transparent 1px);background-size:28px 28px}
.ic{vertical-align:-4px;margin-right:7px;flex:none}.tile .ic{color:var(--ac);width:20px;height:20px}header .ic{color:#fb923c}nav button.on .ic{color:var(--ac)}
@media(max-width:700px){nav{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-wrap:nowrap;overflow-x:auto;padding:0 4px env(safe-area-inset-bottom,0px);border-top:1px solid var(--ln);border-bottom:0}nav button{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:8px 10px;white-space:nowrap;flex:none;border-bottom:0}nav button .ic{margin:0 0 3px;width:22px;height:22px}main{padding-bottom:90px}#toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
@media print{body{background-image:none!important}}
main{padding:14px 18px 40px;max-width:100%;overflow-x:auto}
h2{margin:6px 0 12px;font-size:20px}h3{margin:20px 0 8px;font-size:16px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:10px 0}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mu);gap:3px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--tx);min-width:0}
textarea{width:100%}
button{font:inherit;padding:8px 14px;border:1px solid var(--ln);border-radius:6px;background:var(--sf);color:var(--tx);cursor:pointer}
button.pr{background:var(--ac);color:var(--on);border-color:var(--ac)}
table{border-collapse:collapse;background:var(--sf);margin:6px 0}
th,td{border:1px solid var(--ln);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--hl)}td input{width:100%}
td small{display:block;color:var(--mu)}
tr.t td{font-weight:700;background:var(--hl)}
.mu{color:var(--mu)}
.paper{background:var(--sf);border:1px solid var(--ln);padding:22px;max-width:760px}
.sig{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
@media print{.np,header,nav{display:none!important}body{background:#fff;color:#000}.paper{border:0;padding:0;background:#fff}table{background:#fff}th,td{border-color:#000}th{background:#eee}}
</style></head>
<body>
<header class="np"><div><b><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>Склад</b><span>Мини-1С · v1.0</span></div><div id="who"></div></header>
<nav id="nav"></nav>
<main><div id="v"></div></main>
<div id="toast" class="np"></div>
<datalist id="pl"></datalist>
<script>
const K='sklad_mini1c';
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}
D=D||{org:'Baraka Fuds',users:[],n:0,prods:[],reg:{},rec:[],iss:[],kgs:['1 МТТ','5 МТТ','8 МТТ','9 МТТ','29 МТТ','31 МТТ','32 МТТ','35 МТТ','42 МТТ','52 МТТ','54 МТТ']};
D.users=D.users||[];D.pay=[];D.orgs=D.orgs||[{name:'Организация',addr:'',phone:'',acc:'',mfo:'',stir:'',vat:'',rate:0,contract:''}];const save=()=>{clearTimeout(st);st=setTimeout(()=>{if(db)db.doc('app/ref').set({org:D.org,orgs:D.orgs,prods:D.prods,kgs:D.kgs,reg:D.reg,auto:D.auto===undefined?true:D.auto}).then(()=>toast('Сохранено ✓')).catch(e=>alert('Не удалось сохранить: '+(e.message||e.code)))},300)};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fd=d=>d.split('-').reverse().join('.');
const nf=n=>(Math.round(n*1000)/1000).toLocaleString('ru-RU');
const P=n=>D.prods.find(p=>p.name===n);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const stock=p=>sum(D.rec,r=>sum(r.items.filter(i=>i.p===p),i=>i.q))-sum(D.iss,r=>sum(r.items.filter(i=>i.p===p),i=>i.q));
const rem=(kg,p)=>({reg:(D.reg[kg]||{})[p],used:sum(D.iss.filter(x=>x.kg===kg),x=>sum(x.items.filter(i=>i.p===p),i=>i.q))});
const tabs=[['home','Главная'],['rec','Приход'],['iss','Расход'],['inv','Фактура'],['sup','Поставщики'],['kgv','Детсады'],['rep','Отчёт по детсаду'],['sv','Свод и остатки'],['jr','Журнал документов'],['st','Остатки'],['fin','Деньги'],['log','Действия'],['ref','Справочники']];
let cur='rec',rows=[],sel=null;
function nav(){$('#who').innerHTML=esc(me.name)+(me.role=='admin'?' (редактор)':'')+'<button onclick="logout()">Выйти</button>';$('#nav').innerHTML=tabs.filter(t=>!['ref','fin','log'].includes(t[0])||me.role=='admin').map(t=>`<button class="${t[0]==cur?'on':''}" onclick="navTo('${t[0]}')">${ic(t[0])}${t[1]}</button>`).join('')}
function go(t){editing=null;if(!me)return login();if(['ref','fin','log'].includes(t)&&me.role!='admin')t='home';cur=t;rows=[{p:'',q:''}];$('#pl').innerHTML=D.prods.map(p=>`<option value="${esc(p.name)}">`).join('');nav();V[t]()}
function box(text){let t=$('#cp');if(!t){t=document.createElement('textarea');t.id='cp';t.rows=8;$('#v').appendChild(t)}t.value=text;t.select();try{document.execCommand('copy')}catch(e){}}
function noProds(){if(D.prods.length)return false;$('#v').innerHTML='<h2>Нет товаров</h2><p>Сначала добавьте товары в разделе «Справочники».</p>';return true}
function drawRows(){
 $('#rw').innerHTML='<table><tr><th>Товар (начните печатать)</th><th>Количество</th><th></th></tr>'+rows.map((r,i)=>`<tr><td><input id="p${i}" list="pl" value="${esc(r.p)}" onkeydown="kd(event,${i},'p')" oninput="rows[${i}].p=this.value;hint(${i});if(event.inputType=='insertReplacementText'&&P(this.value))$('#q${i}').focus()"></td><td><input id="q${i}" type="number" step="any" min="0" value="${r.q}" onkeydown="kd(event,${i},'q')" oninput="rows[${i}].q=this.value"><small id="h${i}"></small></td><td><button onclick="rows.splice(${i},1);if(!rows.length)rows.push({p:'',q:''});drawRows()">×</button></td></tr>`).join('')+'</table>';
 rows.forEach((_,i)=>hint(i));const f=rows.findIndex(r=>!r.p);if(f>=0&&!(document.activeElement&&document.activeElement.tagName=='INPUT'))$('#p'+f).focus()}
function kd(e,i,f){if(e.key!='Enter')return;e.preventDefault();if(f=='p')$('#q'+i).focus();else{if(i==rows.length-1)addRow();$('#p'+(i+1)).focus()}}
function hint(i){const e=$('#h'+i);if(!e)return;const r=rows[i],p=P(r.p);if(!r.p){e.textContent='';return}
 if(!p){e.textContent='нет в справочнике';return}
 let t=p.unit||'';
 if(cur=='iss'){t+=` · на складе ${nf(stock(r.p))}`}
 e.textContent=t}
function addRow(){rows.push({p:'',q:''});drawRows()}
function clean(){const all=rows.filter(r=>r.p||r.q),ok=all.filter(r=>P(r.p)&&+r.q>0).map(r=>({p:r.p,q:+r.q}));
 if(!ok.length){alert('Выберите товары из списка и укажите количество');return null}
 if(ok.length<all.length&&!confirm('Часть строк не распознана (нет в справочнике или нет количества) и не будет сохранена. Продолжить?'))return null;return ok}
function saveRec(){const it=clean();if(!it)return;let r;if(editing&&editing.kind=='rec'){const o=D.rec.find(x=>x.id==editing.id);r={...o,date:$('#d').value,sup:$('#s').value,items:it,editedBy:me.name};D.rec=D.rec.map(x=>x.id==o.id?r:x)}else{r={id:Date.now(),time:new Date().toTimeString().slice(0,5),num:Math.max(0,...D.rec.map(x=>x.num||0))+1,date:$('#d').value,sup:$('#s').value,items:it,by:me.name};D.rec.push(r)}put('rec',r);go('rec')}
function saveIss(){const it=clean();if(!it)return;const kg=$('#k').value;
 const o1=[],o2=(editing||$('#rt').checked)?[]:it.filter(x=>x.q>stock(x.p));
 if(o1.length&&!confirm('Больше остатка по реестру: '+o1.map(x=>x.p).join(', ')+'. Сохранить?'))return;
 if(o2.length&&!confirm('Больше, чем на складе: '+o2.map(x=>x.p).join(', ')+'. Сохранить?'))return;
 const o={id:Math.max(0,...D.iss.map(x=>x.id))+1,by:me.name,drv:$('#dn').value.trim(),drvNo:$('#dp').value.trim(),note:$('#dc').value.trim(),time:new Date().toTimeString().slice(0,5),org:cl(D.orgs[+$('#og').value]||D.orgs[0]),date:$('#d').value,kg,items:it.map(x=>({p:x.p,q:$('#rt').checked?-x.q:x.q,price:P(x.p).price||0})),ret:$('#rt').checked};if(editing&&editing.kind=='iss'){const old=D.iss.find(x=>x.id==editing.id);o.id=old.id;o.time=old.time;o.by=old.by;o.editedBy=me.name;o.items=o.items.map(x=>{const q=old.items.find(i=>i.p==x.p);return q?{...x,price:q.price}:x});D.iss=D.iss.map(x=>x.id==old.id?o:x);put('iss',o);sel=o.id;go('inv');return}
 D.iss.push(o);put('iss',o);sel=o.id;go('inv');if(D.auto!==false)setTimeout(printInv,300)}
const V={
fin(){const pin=sum(D.pay.filter(p=>p.dir=='in'),p=>p.amount),pout=sum(D.pay.filter(p=>p.dir=='out'),p=>p.amount),billed=sum(D.iss,r=>sum(r.items,i=>i.q*i.price)),names=[...new Set([...D.pay.map(p=>p.who),...D.iss.map(r=>r.kg)])].filter(Boolean).sort(),all=[...new Set([...names,...D.kgs])];
 const sx=n=>{const b=sum(D.iss.filter(r=>r.kg==n),r=>sum(r.items,i=>i.q*i.price)),a=sum(D.pay.filter(p=>p.who==n&&p.dir=='in'),p=>p.amount),o=sum(D.pay.filter(p=>p.who==n&&p.dir=='out'),p=>p.amount);return {b,a,o,d:b-a+o}};
 $('#v').innerHTML=`<h2>Деньги</h2><div class="tiles"><div class="tile"><b>${nf(pin)}</b>${ic('rec',16)}получено</div><div class="tile"><b>${nf(pout)}</b>${ic('iss',16)}выдано</div><div class="tile"><b>${nf(pin-pout)}</b>${ic('fin',16)}баланс: получено минус выдано</div><div class="tile"><b>${nf(billed)}</b>${ic('inv',16)}отпущено по фактурам</div></div><h3>Новая операция</h3><div class="bar"><label>Тип<select id="pd"><option value="in">Получили деньги</option><option value="out">Выдали деньги</option></select></label><label>Дата<input type="date" id="pt2" value="${today()}"></label><label>От кого / кому<input id="pw2" list="nl"><datalist id="nl">${all.map(n=>`<option value="${esc(n)}">`).join('')}</datalist></label><label>Сумма<input type="number" step="any" min="0" id="pa"></label><label>Комментарий<input id="pc"></label><button class="pr" onclick="savePay()">Сохранить</button></div><h3>Расчёты по контрагентам</h3>`+(names.length?`<table><tr><th>Кто</th><th>Отпущено по фактурам</th><th>Получили от него</th><th>Выдали ему</th><th>Долг</th></tr>${names.map(n=>{const s=sx(n);return `<tr><td>${esc(n)}</td><td>${nf(s.b)}</td><td>${nf(s.a)}</td><td>${nf(s.o)}</td><td><b>${nf(s.d)}</b></td></tr>`}).join('')}</table><p class="mu">Долг = отпущено по фактурам − получено + выдано. Плюс: он должен нам. Минус: мы должны ему.</p>`:'<p class="mu">Операций пока нет.</p>')+'<h3>Журнал денег</h3>'+(D.pay.length?`<table><tr><th>Дата</th><th>Тип</th><th>Кто</th><th>Сумма</th><th>Комментарий</th><th></th></tr>${[...D.pay].reverse().map(p=>`<tr><td>${fd(p.date)} ${p.time||''}</td><td>${p.dir=='in'?'Получили':'Выдали'}</td><td>${esc(p.who)}</td><td>${nf(p.amount)}</td><td>${esc(p.note||'')}</td><td><button onclick="delPay(${p.id})">Удалить</button></td></tr>`).join('')}</table>`:'<p class="mu">Пусто.</p>')},
jr(){const iss=jrKind=='iss',L=(iss?D.iss:D.rec).filter(r=>(!jrDate||r.date==jrDate)&&(!jrQ||JSON.stringify(r).toLowerCase().includes(jrQ.toLowerCase()))),g={};L.forEach(r=>(g[r.date]=g[r.date]||[]).push(r));const ds=Object.keys(g).sort().reverse();
 $('#v').innerHTML=`<h2>Журнал документов</h2><div class="bar"><button class="${iss?'pr':''}" onclick="jrKind='iss';V.jr()">${ic('inv')}Расходы и фактуры</button><button class="${iss?'':'pr'}" onclick="jrKind='rec';V.jr()">${ic('rec')}Приходы</button><label>Дата<input type="date" value="${jrDate}" onchange="jrDate=this.value;V.jr()"></label><button onclick="jrDate='';V.jr()">Все даты</button><label>Поиск<input value="${esc(jrQ)}" onchange="jrQ=this.value;V.jr()"></label><button onclick="copyOut()">Скачать Excel</button></div>`+(ds.length?ds.map(d=>`<h3>${fd(d)} <span class="mu">${g[d].length} шт.</span></h3><table><tr><th>№</th><th>Время</th><th>${iss?'Детсад':'Поставщик'}</th><th>${iss?'Сумма':'Позиций'}</th><th></th></tr>${g[d].sort((a,b)=>a.id-b.id).map(r=>`<tr><td>${iss?fn(r.id):(r.num?'ПР-'+String(r.num).padStart(4,'0'):'')}</td><td>${r.time||''}</td><td>${esc(iss?r.kg:(r.sup||''))}</td><td>${iss?nf(sum(r.items,i=>i.q*i.price)):r.items.length}</td><td><button class="pr" onclick="${iss?`sel=${r.id};go('inv')`:`recSel=${r.id};cur='rv';V.rv()`}">Открыть</button></td></tr>`).join('')}</table>`).join(''):'<p class="mu">Документов нет.</p>')},
rv(){const r=D.rec.find(x=>x.id==recSel);if(!r){cur='jr';V.jr();return}
 $('#v').innerHTML=`<div class="bar np"><button onclick="cur='jr';jrKind='rec';V.jr()">← Журнал</button><button class="pr" onclick="printInv()">Печать</button><button onclick="editRec(${r.id})">Изменить</button></div><div class="paper"><h2>Приход ${r.num?'ПР-'+String(r.num).padStart(4,'0'):''}, ${fd(r.date)} ${r.time||''}</h2><p>Поставщик: <b>${esc(r.sup||'')}</b>${r.by?'<br>Внёс: '+esc(r.by):''}</p><table><tr><th>№</th><th>Товар</th><th>Ед.</th><th>Количество</th></tr>${r.items.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.p)}</td><td>${esc(P(i.p)?.unit||'')}</td><td>${nf(i.q)}</td></tr>`).join('')}</table></div>`},
sup(){const ss=[...new Set(D.rec.map(r=>(r.sup||'').trim()).filter(Boolean))].sort(),L=D.rec.filter(r=>supSel=='*'||(r.sup||'').trim()==supSel).sort((a,b)=>(b.date+(b.time||'')).localeCompare(a.date+(a.time||'')));
 $('#v').innerHTML=`<h2>Поставщики: что принесли</h2><div class="bar">${['*',...ss].map(s=>`<button class="${s==supSel?'pr':''}" data-s="${esc(s)}" onclick="supSel=this.dataset.s;V.sup()">${s=='*'?'Все':esc(s)}</button>`).join('')}</div>`+(L.length?L.map(r=>`<h3>${fd(r.date)} ${r.time||''} ${r.sup?', '+esc(r.sup):''} <span class="mu">${r.num?'ПР-'+String(r.num).padStart(4,'0'):''}</span></h3><table><tr><th>Товар</th><th>Количество</th></tr>${r.items.map(i=>`<tr><td>${esc(i.p)}</td><td>${nf(i.q)} ${esc(P(i.p)?.unit||'')}</td></tr>`).join('')}</table>`).join(''):'<p class="mu">Приходов нет.</p>')},
kgv(){const L=D.iss.filter(x=>x.kg==kgSel).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);

function kgTable(kg,a,b){

 return `<h3>${esc(kg)}</h3><table><tr><th>Дата</th><th>Товар</th><th>Выдано</th></tr>${dr||'<tr><td colspan="3">Нет выдачи за период</td></tr>'}</table>

 if(!rows.length)return alert('Нет данных');const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Отчёт');XLSX.writeFile(wb,'Отчёт_'+today()+'.xlsx')}
function loginScreen(){me=null;$('#nav').innerHTML='';$('#who').innerHTML='';$('#v').innerHTML=`<div style="min-height:68vh;display:flex;align-items:center;justify-content:center"><div class="paper" style="width:100%;max-width:380px;text-align:center;padding:28px;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.15)"><div style="color:var(--ac);margin-bottom:6px">${ic('box',44)}</div><h2 style="margin:0 0 4px">Склад</h2><p class="mu" style="margin:0 0 18px">Войдите в свой аккаунт</p><label style="text-align:left">Почта<input id="em" type="email" autocomplete="username"></label><label style="text-align:left;margin-top:10px">Пароль<input id="pw" type="password" autocomplete="current-password"></label><button class="pr big" style="width:100%;margin-top:16px" onclick="signIn()">Войти</button></div></div>`;$('#pw').onkeydown=e=>{if(e.key=='Enter')signIn()}}

function uw(n){n=Math.abs(Math.round(n));if(!n)return 'нол';const U=['','бир','икки','уч','тўрт','беш','олти','етти','саккиз','тўққиз'],T=['','ўн','йигирма','ўттиз','қирқ','эллик','олтмиш','етмиш','саксон','тўқсон'],S=['','минг','миллион','миллиард'];let o=[],i=0;while(n>0){const g=n%1000;if(g){const h=Math.floor(g/100),t=Math.floor(g%100/10),u=g%10;o.unshift([h?(h>1?U[h]+' ':'')+'юз':'',T[t],U[u],S[i]].filter(Boolean).join(' '))}n=Math.floor(n/1000);i++}return o.join(' ')}

start();
</script>
